<title>Rumba Master</title>

<style>
  :root{
    --bg-0:#050505; --bg-1:#121212; --bg-2:#1B1B1B;
    --pink:#FF1E3C; --cyan:#FFFFFF; --gold:#FFC857;
    --text:#F5F5F5; --text-dim:#A3A3A3; --line: rgba(255,255,255,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:radial-gradient(ellipse at 20% -10%, rgba(255,30,60,0.12), var(--bg-0) 55%); color:var(--text); font-family:'Work Sans', sans-serif; min-height:100vh;}
  .display{font-family:'Archivo Black', sans-serif; text-transform:uppercase; letter-spacing:0.5px;}
  .wrap{max-width:520px; margin:0 auto; padding:28px 20px 80px;}
  header.top{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px;}
  .logo{font-size:28px; line-height:0.95;} .logo span{color:var(--pink);}
  .brand-logo{height:54px; width:auto; display:block;}
  .month-tag{font-size:12px; color:var(--text-dim); border:1px solid var(--line); padding:5px 10px; border-radius:20px;}
  .tagline{color:var(--text-dim); font-size:15px; margin:0 0 28px; max-width:38ch;}
  .section-head{display:flex; align-items:center; gap:10px; margin:34px 0 14px;}
  .section-head h2{font-size:15px; margin:0; font-weight:600; color:var(--text-dim);}
  .section-head .rule{flex:1; height:1px; background:var(--line);}
  .podium{display:flex; flex-direction:column; gap:10px;}
  .podium-card{display:flex; align-items:center; gap:14px; background:var(--bg-2); border:1px solid var(--line); border-radius:14px; padding:14px 16px;}
  .podium-card.rank-1{border-color:rgba(255,200,87,0.5); box-shadow:0 0 0 1px rgba(255,200,87,0.15) inset;}
  .rank-num{font-family:'Archivo Black'; font-size:30px; width:44px; text-align:center; color:var(--text-dim);}
  .rank-1 .rank-num{color:var(--gold);} .rank-2 .rank-num{color:#D8D8E4;} .rank-3 .rank-num{color:#CB8A5A;}
  .card-body{flex:1; min-width:0;} .card-body .name{font-weight:600; font-size:16px; margin-bottom:3px;}
  .card-body .meta{font-size:12px; color:var(--text-dim);}
  .score{font-family:'Archivo Black'; font-size:20px; color:var(--cyan);}
  .list-row{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line);}
  .list-row .rank-num{font-size:16px; width:26px; color:var(--text-dim); font-family:'Work Sans'; font-weight:700;}
  .list-row .name{font-size:14px; font-weight:500;} .list-row .score{font-size:14px;}
  .cta-card{margin-top:34px; padding:20px; border-radius:16px; background:linear-gradient(135deg, rgba(255,30,60,0.22), rgba(255,255,255,0.05)); border:1px solid rgba(255,30,60,0.4);}
  .cta-card h3{margin:0 0 6px; font-size:17px;} .cta-card p{margin:0 0 14px; font-size:13px; color:var(--text-dim);}
  .btn{display:inline-block; width:100%; text-align:center; background:var(--pink); color:#0A0A0A; font-weight:700; border:none; padding:13px 16px; border-radius:10px; font-size:15px; cursor:pointer; font-family:'Work Sans';}
  .btn.secondary{background:transparent; color:var(--text); border:1px solid var(--line);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}
  .vote-header{margin-bottom:24px;} .vote-header .club-name{font-size:22px; margin:6px 0 2px;} .vote-header .sub{color:var(--text-dim); font-size:13px;}
  label.field-label{display:block; font-size:13px; color:var(--text-dim); margin-bottom:6px; margin-top:20px;}
  input[type=tel]{width:100%; padding:13px 14px; border-radius:10px; border:1px solid var(--line); background:var(--bg-1); color:var(--text); font-size:16px; font-family:'Work Sans';}
  input[type=tel]:focus{outline:2px solid var(--pink); outline-offset:1px;}
  .category-block{margin-top:22px;} .category-block .cat-title{font-weight:600; font-size:14px; margin-bottom:8px;}
  .stars{display:flex; gap:8px;}
  .star-btn{width:42px; height:42px; border-radius:10px; border:1px solid var(--line); background:var(--bg-1); color:var(--text-dim); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .star-btn.active{background:var(--pink); border-color:var(--pink); color:#0A0A0A;}
  .status-msg{margin-top:18px; padding:12px 14px; border-radius:10px; font-size:13px; background:var(--bg-1); border:1px solid var(--line); color:var(--text-dim);}
  .status-msg.error{border-color:var(--pink); color:var(--pink);} .status-msg.success{border-color:var(--cyan); color:var(--cyan);}
  .back-link{display:inline-block; margin-bottom:14px; color:var(--text-dim); font-size:13px; text-decoration:none; border:none; background:none; cursor:pointer; font-family:'Work Sans';}
  .footer-note{margin-top:40px; font-size:11px; color:var(--text-dim); line-height:1.6; text-align:center;}
  .setup-box{background:var(--bg-1); border:1px solid var(--pink); border-radius:12px; padding:18px; font-size:13px; line-height:1.6;}
  .setup-box code{background:var(--bg-0); padding:2px 6px; border-radius:6px;}
</style>
</head>

const SEED_CLUBS = [
  'La Fábrica Nocturna','Sótano 45','Vértigo Club','Luna Roja','Estación Norte',
  'Distrito Neón','El Almacén','Casa Eclipse','Terraza Cielo','Bunker Bogotá',
  'Zona Alta','El Galpón','Kaleido','Nave 7','La Otra Orilla'
].map((name,i)=>({id:'club-'+(i+1), name}));

let db = null;
let state = { view: 'home', clubId: null, ratings: {}, phone: '', volveria: null };

function isConfigured(){
  return firebaseConfig.apiKey && firebaseConfig.apiKey !== "TU_API_KEY";
}

function qs(name){
  return new URLSearchParams(window.location.search).get(name);
}

function getWeekKey(){
  const d = new Date();
  const onejan = new Date(d.getFullYear(),0,1);
  const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay()+1)/7);
  return d.getFullYear()+'-w'+week;
}

async function getAgg(clubId){
  const ref = db.collection('aggregates').doc(clubId);
  const snap = await ref.get();
  if(snap.exists) return snap.data();
  return {sums:{...DEFAULT_SUMS}, count:0, volveriasSi:0};
}

function avgOf(agg){
  if(!agg.count) return 0;
  const total = CATEGORIES.reduce((s,c)=> s + (agg.sums[c.id]||0), 0);
  return total / (agg.count * CATEGORIES.length);
}

async function buildRanking(){
  const results = await Promise.all(SEED_CLUBS.map(async (c)=>{
    const agg = await getAgg(c.id);
    return {...c, avg: avgOf(agg), count: agg.count};
  }));
  results.sort((a,b)=> b.avg - a.avg);
  return results;
}

function starRow(catId, value){
  let html = '<div class="stars">';
  for(let i=1;i<=5;i++){
    const active = value >= i ? 'active' : '';
    html += `<button type="button" class="star-btn ${active}" data-cat="${catId}" data-val="${i}">★</button>`;
  }
  html += '</div>';
  return html;
}

      <strong>Falta un paso para activar la app.</strong><br><br>
      Esta página necesita una base de datos gratuita en Firebase para que los votos de todas las discotecas se guarden en un solo lugar compartido.<br><br>
      1. Entra a <code>console.firebase.google.com</code> y crea un proyecto.<br>
      2. Dentro del proyecto, activa <code>Firestore Database</code> (modo de prueba).<br>
      3. Ve a configuración del proyecto → tus apps → agregar app web, y copia el objeto <code>firebaseConfig</code>.<br>
      4. Pega ese objeto en este archivo, reemplazando el que dice <code>TU_API_KEY</code>, al inicio del código.<br>
      5. Vuelve a subir el archivo a GitHub y espera a que Vercel lo publique de nuevo.
    </div>
  `;
}

const RANKING_CACHE_KEY = 'rm_ranking_cache_v1';
const RANKING_CACHE_MS = 60 * 1000; // 1 minuto

function readRankingCache(){
  try{
    const raw = localStorage.getItem(RANKING_CACHE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(Date.now() - parsed.ts > RANKING_CACHE_MS) return null;
    return parsed.data;
  }catch(e){ return null; }
}

function writeRankingCache(data){
  try{
    localStorage.setItem(RANKING_CACHE_KEY, JSON.stringify({ts: Date.now(), data}));
  }catch(e){ /* ignora si el navegador bloquea localStorage */ }
}

function paintRanking(ranking){
  const top3 = ranking.slice(0,3);
  const rest = ranking.slice(3);

  document.getElementById('podium').innerHTML = top3.map((c,i)=>`
    <div class="podium-card rank-${i+1}" data-club="${c.id}" style="cursor:pointer">
      <div class="rank-num">${i+1}</div>
      <div class="card-body"><div class="name">${c.name}</div><div class="meta">${c.count} calificaciones</div></div>
      <div class="score">${c.count ? c.avg.toFixed(1) : '—'}</div>
    </div>
  `).join('') || '<div class="status-msg">Todavía no hay calificaciones esta semana.</div>';

  document.getElementById('fulllist').innerHTML = rest.map((c,i)=>`
    <div class="list-row" data-club="${c.id}" style="cursor:pointer">
      <div class="rank-num">${i+4}</div>
      <div class="name" style="flex:1">${c.name}</div>
      <div class="score">${c.count ? c.avg.toFixed(1) : '—'}</div>
    </div>
  `).join('');

  document.querySelectorAll('[data-club]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.view = 'vote';
      state.clubId = el.getAttribute('data-club');
      state.ratings = {};
      state.volveria = null;
      render();
    });
  });
}

async function renderHome(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header class="top">
      <img src="${LOGO_DATA_URI}" alt="Rumba Master" class="brand-logo">
      <div class="month-tag">Edición marzo · Bogotá</div>
    </header>
    <p class="tagline">Un mes, quince discotecas, un solo ranking. Cada persona que entra califica la rumba en el momento, con su código QR.</p>
    <div class="section-head"><h2>Ranking en vivo</h2><div class="rule"></div></div>
    <div id="podium" class="podium"></div>
    <div class="section-head"><h2>Todas las inscritas</h2><div class="rule"></div></div>
    <div id="fulllist"></div>
    <div class="cta-card">
      <h3>¿Estás en una discoteca ahora?</h3>
      <p>Escanea el código QR de la mesa o la entrada para calificar tu experiencia de esta noche. También puedes darle clic directo a cualquier discoteca del ranking de arriba para calificarla.</p>
    </div>
    <div class="footer-note">Rumba Master · votación por número celular · un voto por persona por discoteca cada semana</div>
  `;

  const cached = readRankingCache();
  if(cached){
    paintRanking(cached);
  } else {
    document.getElementById('podium').innerHTML = '<div class="status-msg">Cargando ranking...</div>';
  }

  // Siempre trae los datos frescos de Firestore en segundo plano y actualiza
  // la pantalla si cambiaron, así la próxima visita carga instantáneo desde caché.
  const fresh = await buildRanking();
  paintRanking(fresh);
  writeRankingCache(fresh);
}

function renderVote(){
  const app = document.getElementById('app');
  const club = SEED_CLUBS.find(c=>c.id===state.clubId) || SEED_CLUBS[0];

  app.innerHTML = `
    <button class="back-link" id="backBtn">← Volver al ranking</button>
    <div class="vote-header">
      <div class="month-tag" style="display:inline-block">Calificación de esta noche</div>
      <div class="club-name display">${club.name}</div>
      <div class="sub">Califica cada categoría del 1 al 5. Tu número solo se usa para evitar votos duplicados.</div>
    </div>
    <label class="field-label">Número de celular</label>
    <input type="tel" id="phoneInput" placeholder="Ej: 3001234567" value="${state.phone}">
    ${CATEGORIES.map(c=>`
      <div class="category-block">
        <div class="cat-title">${c.label}</div>
        ${starRow(c.id, state.ratings[c.id]||0)}
      </div>
    `).join('')}
    <div class="category-block">
      <div class="cat-title">¿Volverías?</div>
      <div class="stars">
        <button type="button" class="star-btn yn-btn ${state.volveria==='si' ? 'active' : ''}" data-yn="si" style="width:auto; padding:0 20px;">Sí</button>
        <button type="button" class="star-btn yn-btn ${state.volveria==='no' ? 'active' : ''}" data-yn="no" style="width:auto; padding:0 20px;">No</button>
      </div>
    </div>
    <div style="margin-top:26px"><button class="btn" id="submitVote">Enviar calificación</button></div>
    <div id="statusMsg"></div>
  `;

  document.getElementById('backBtn').addEventListener('click', ()=>{ state.view='home'; render(); });
  document.getElementById('phoneInput').addEventListener('input', (e)=>{ state.phone = e.target.value; });
  app.querySelectorAll('.star-btn[data-cat]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.ratings[btn.dataset.cat] = parseInt(btn.dataset.val,10);
      renderVote();
    });
  });
  app.querySelectorAll('.yn-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.volveria = btn.getAttribute('data-yn');
      renderVote();
    });
  });
  document.getElementById('submitVote').addEventListener('click', ()=> submitVote(club));
}

async function submitVote(club){
  const statusEl = document.getElementById('statusMsg');
  const phone = state.phone.trim().replace(/\D/g,'');

  if(phone.length < 7){
    statusEl.innerHTML = '<div class="status-msg error">Escribe un número de celular válido.</div>';
    return;
  }
  const missing = CATEGORIES.filter(c=> !state.ratings[c.id]);
  if(missing.length){
    statusEl.innerHTML = `<div class="status-msg error">Falta calificar: ${missing.map(m=>m.label).join(', ')}.</div>`;
    return;
  }
  if(!state.volveria){
    statusEl.innerHTML = '<div class="status-msg error">Falta responder si volverías.</div>';
    return;
  }

  const submitBtn = document.getElementById('submitVote');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Enviando...';

  const weekKey = getWeekKey();
  const voteId = `${club.id}_${weekKey}_${phone}`;

  try{
    const voteRef = db.collection('votes').doc(voteId);
    const voteSnap = await voteRef.get();
    if(voteSnap.exists){
      statusEl.innerHTML = '<div class="status-msg error">Este número ya calificó esta discoteca esta semana.</div>';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enviar calificación';
      return;
    }

    await voteRef.set({...state.ratings, volveria: state.volveria, clubId: club.id, week: weekKey, ts: Date.now()});

    const aggRef = db.collection('aggregates').doc(club.id);
    await db.runTransaction(async (tx)=>{
      const snap = await tx.get(aggRef);
      const agg = snap.exists ? snap.data() : {sums:{...DEFAULT_SUMS}, count:0, volveriasSi:0};
      CATEGORIES.forEach(c=>{ agg.sums[c.id] = (agg.sums[c.id]||0) + state.ratings[c.id]; });
      agg.count += 1;
      agg.volveriasSi = (agg.volveriasSi||0) + (state.volveria==='si' ? 1 : 0);
      tx.set(aggRef, agg);
    });

    statusEl.innerHTML = '<div class="status-msg success">¡Gracias! Tu calificación quedó registrada para esta semana.</div>';
    submitBtn.textContent = 'Enviado ✓';
  }catch(e){
    statusEl.innerHTML = '<div class="status-msg error">No se pudo enviar. Revisa tu conexión e intenta de nuevo.</div>';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Enviar calificación';
  }
}

async function render(){
  if(state.view === 'home') await renderHome();
  else renderVote();
}

(function init(){
  if(!isConfigured()){
    renderSetupNeeded();
    return;
  }
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();

  const clubParam = qs('d');
  if(clubParam){ state.view = 'vote'; state.clubId = clubParam; }
  render();
})();
</script>
