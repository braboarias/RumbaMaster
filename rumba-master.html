<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rumba Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#14091F;
    --bg-1:#1F0F2E;
    --bg-2:#2A1640;
    --pink:#FF2E88;
    --cyan:#29F1E0;
    --gold:#FFC857;
    --text:#F5EEFB;
    --text-dim:#B9A8CC;
    --line: rgba(245,238,251,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:radial-gradient(ellipse at 20% 0%, var(--bg-1), var(--bg-0) 60%);
    color:var(--text);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
  }
  .display{font-family:'Archivo Black', sans-serif; text-transform:uppercase; letter-spacing:0.5px;}
  .wrap{max-width:520px; margin:0 auto; padding:28px 20px 80px;}

  header.top{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px;}
  .logo{font-size:28px; line-height:0.95;}
  .logo span{color:var(--pink);}
  .month-tag{font-size:12px; color:var(--text-dim); border:1px solid var(--line); padding:5px 10px; border-radius:20px;}

  .tagline{color:var(--text-dim); font-size:15px; margin:0 0 28px; max-width:38ch;}

  .section-head{display:flex; align-items:center; gap:10px; margin:34px 0 14px;}
  .section-head h2{font-size:15px; margin:0; font-weight:600; color:var(--text-dim);}
  .section-head .rule{flex:1; height:1px; background:var(--line);}

  .podium{display:flex; flex-direction:column; gap:10px;}
  .podium-card{
    display:flex; align-items:center; gap:14px;
    background:var(--bg-2); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; position:relative; overflow:hidden;
  }
  .podium-card.rank-1{border-color:rgba(255,200,87,0.5); box-shadow:0 0 0 1px rgba(255,200,87,0.15) inset;}
  .rank-num{font-family:'Archivo Black'; font-size:30px; width:44px; text-align:center; color:var(--text-dim);}
  .rank-1 .rank-num{color:var(--gold);}
  .rank-2 .rank-num{color:#D8D8E4;}
  .rank-3 .rank-num{color:#CB8A5A;}
  .card-body{flex:1; min-width:0;}
  .card-body .name{font-weight:600; font-size:16px; margin-bottom:3px;}
  .card-body .meta{font-size:12px; color:var(--text-dim);}
  .score{font-family:'Archivo Black'; font-size:20px; color:var(--cyan);}

  .list-row{
    display:flex; align-items:center; gap:12px;
    padding:12px 4px; border-bottom:1px solid var(--line);
  }
  .list-row .rank-num{font-size:16px; width:26px; color:var(--text-dim); font-family:'Work Sans'; font-weight:700;}
  .list-row .name{font-size:14px; font-weight:500;}
  .list-row .score{font-size:14px;}

  .cta-card{
    margin-top:34px; padding:20px; border-radius:16px;
    background:linear-gradient(135deg, rgba(255,46,136,0.18), rgba(41,241,224,0.10));
    border:1px solid rgba(255,46,136,0.35);
  }
  .cta-card h3{margin:0 0 6px; font-size:17px;}
  .cta-card p{margin:0 0 14px; font-size:13px; color:var(--text-dim);}
  .btn{
    display:inline-block; width:100%; text-align:center;
    background:var(--pink); color:#170512; font-weight:700;
    border:none; padding:13px 16px; border-radius:10px; font-size:15px;
    cursor:pointer; font-family:'Work Sans';
  }
  .btn.secondary{background:transparent; color:var(--text); border:1px solid var(--line);}
  .btn:disabled{opacity:0.5; cursor:not-allowed;}

  /* Vote view */
  .vote-header{margin-bottom:24px;}
  .vote-header .club-name{font-size:22px; margin:6px 0 2px;}
  .vote-header .sub{color:var(--text-dim); font-size:13px;}

  label.field-label{display:block; font-size:13px; color:var(--text-dim); margin-bottom:6px; margin-top:20px;}
  input[type=tel]{
    width:100%; padding:13px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg-1); color:var(--text); font-size:16px; font-family:'Work Sans';
  }
  input[type=tel]:focus{outline:2px solid var(--pink); outline-offset:1px;}

  .category-block{margin-top:22px;}
  .category-block .cat-title{font-weight:600; font-size:14px; margin-bottom:8px;}
  .stars{display:flex; gap:8px;}
  .star-btn{
    width:42px; height:42px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg-1); color:var(--text-dim); font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .star-btn.active{background:var(--pink); border-color:var(--pink); color:#170512;}

  .status-msg{
    margin-top:18px; padding:12px 14px; border-radius:10px; font-size:13px;
    background:var(--bg-1); border:1px solid var(--line); color:var(--text-dim);
  }
  .status-msg.error{border-color:var(--pink); color:var(--pink);}
  .status-msg.success{border-color:var(--cyan); color:var(--cyan);}

  .back-link{
    display:inline-block; margin-bottom:14px; color:var(--text-dim); font-size:13px;
    text-decoration:none; border:none; background:none; cursor:pointer; font-family:'Work Sans';
  }
  .footer-note{margin-top:40px; font-size:11px; color:var(--text-dim); line-height:1.6; text-align:center;}
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<script>
const CATEGORIES = [
  {id:'escenografia', label:'Escenografía'},
  {id:'coctel', label:'Cócteles'},
  {id:'musica', label:'Música'},
  {id:'experiencia', label:'Experiencia general'}
];

const SEED_CLUBS = [
  'La Fábrica Nocturna','Sótano 45','Vértigo Club','Luna Roja','Estación Norte',
  'Distrito Neón','El Almacén','Casa Eclipse','Terraza Cielo','Bunker Bogotá',
  'Zona Alta','El Galpón','Kaleido','Nave 7','La Otra Orilla'
];

let state = { view: 'home', clubId: null, ratings: {}, phone: '' };

function qs(name){
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

async function ensureSeed(){
  try{
    await window.storage.get('clubs-list', true);
  }catch(e){
    const clubs = SEED_CLUBS.map((name,i)=>({id:'club-'+(i+1), name}));
    await window.storage.set('clubs-list', JSON.stringify(clubs), true);
    for(const c of clubs){
      await window.storage.set('agg:'+c.id, JSON.stringify({
        sums:{escenografia:0,coctel:0,musica:0,experiencia:0}, count:0
      }), true);
    }
  }
}

async function getClubs(){
  const r = await window.storage.get('clubs-list', true);
  return r ? JSON.parse(r.value) : [];
}

async function getAgg(clubId){
  try{
    const r = await window.storage.get('agg:'+clubId, true);
    return r ? JSON.parse(r.value) : {sums:{escenografia:0,coctel:0,musica:0,experiencia:0}, count:0};
  }catch(e){
    return {sums:{escenografia:0,coctel:0,musica:0,experiencia:0}, count:0};
  }
}

function avgOf(agg){
  if(!agg.count) return 0;
  const total = CATEGORIES.reduce((s,c)=> s + (agg.sums[c.id]||0), 0);
  return total / (agg.count * CATEGORIES.length);
}

async function buildRanking(){
  const clubs = await getClubs();
  const withScores = [];
  for(const c of clubs){
    const agg = await getAgg(c.id);
    withScores.push({...c, avg: avgOf(agg), count: agg.count});
  }
  withScores.sort((a,b)=> b.avg - a.avg);
  return withScores;
}

function starRow(catId, value){
  let html = '<div class="stars">';
  for(let i=1;i<=5;i++){
    const active = value >= i ? 'active' : '';
    html += `<button type="button" class="star-btn ${active}" data-cat="${catId}" data-val="${i}">★</button>`;
  }
  html += '</div>';
  return html;
}

async function renderHome(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header class="top">
      <div class="logo display">RUMBA<br><span>MASTER</span></div>
      <div class="month-tag">Edición marzo · Bogotá</div>
    </header>
    <p class="tagline">Un mes, quince discotecas, un solo ranking. Cada persona que entra califica la rumba en el momento, con su código QR.</p>
    <div class="section-head"><h2>Ranking en vivo</h2><div class="rule"></div></div>
    <div id="podium" class="podium"></div>
    <div class="section-head"><h2>Todas las inscritas</h2><div class="rule"></div></div>
    <div id="fulllist"></div>
    <div class="cta-card">
      <h3>¿Estás en una discoteca ahora?</h3>
      <p>Escanea el código QR de la mesa o la entrada para calificar tu experiencia de esta noche.</p>
      <button class="btn secondary" id="demoVoteBtn">Probar formulario de votación</button>
    </div>
    <div class="footer-note">Rumba Master · votación verificada por número celular · un voto por persona por discoteca cada semana</div>
  `;

  const ranking = await buildRanking();
  const top3 = ranking.slice(0,3);
  const rest = ranking.slice(3);

  document.getElementById('podium').innerHTML = top3.map((c,i)=>`
    <div class="podium-card rank-${i+1}">
      <div class="rank-num">${i+1}</div>
      <div class="card-body">
        <div class="name">${c.name}</div>
        <div class="meta">${c.count} calificaciones</div>
      </div>
      <div class="score">${c.count ? c.avg.toFixed(1) : '—'}</div>
    </div>
  `).join('') || '<div class="status-msg">Todavía no hay calificaciones esta semana.</div>';

  document.getElementById('fulllist').innerHTML = rest.map((c,i)=>`
    <div class="list-row">
      <div class="rank-num">${i+4}</div>
      <div class="name" style="flex:1">${c.name}</div>
      <div class="score">${c.count ? c.avg.toFixed(1) : '—'}</div>
    </div>
  `).join('');

  document.getElementById('demoVoteBtn').addEventListener('click', async ()=>{
    const clubs = await getClubs();
    if(clubs.length){
      state.view = 'vote';
      state.clubId = clubs[0].id;
      state.ratings = {};
      render();
    }
  });
}

async function renderVote(){
  const app = document.getElementById('app');
  const clubs = await getClubs();
  const club = clubs.find(c=>c.id===state.clubId) || clubs[0];

  app.innerHTML = `
    <button class="back-link" id="backBtn">← Volver al ranking</button>
    <div class="vote-header">
      <div class="month-tag" style="display:inline-block">Calificación de esta noche</div>
      <div class="club-name display">${club.name}</div>
      <div class="sub">Califica cada categoría del 1 al 5. Tu número solo se usa para evitar votos duplicados.</div>
    </div>

    <label class="field-label">Número de celular</label>
    <input type="tel" id="phoneInput" placeholder="Ej: 3001234567" value="${state.phone}">

    ${CATEGORIES.map(c=>`
      <div class="category-block">
        <div class="cat-title">${c.label}</div>
        ${starRow(c.id, state.ratings[c.id]||0)}
      </div>
    `).join('')}

    <div style="margin-top:26px">
      <button class="btn" id="submitVote">Enviar calificación</button>
    </div>
    <div id="statusMsg"></div>
  `;

  document.getElementById('backBtn').addEventListener('click', ()=>{
    state.view='home'; render();
  });

  document.getElementById('phoneInput').addEventListener('input', (e)=>{
    state.phone = e.target.value;
  });

  app.querySelectorAll('.star-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cat = btn.dataset.cat;
      const val = parseInt(btn.dataset.val,10);
      state.ratings[cat] = val;
      renderVote();
    });
  });

  document.getElementById('submitVote').addEventListener('click', ()=> submitVote(club));
}

async function submitVote(club){
  const statusEl = document.getElementById('statusMsg');
  const phoneRaw = state.phone.trim();
  const phone = phoneRaw.replace(/\D/g,'');

  if(phone.length < 7){
    statusEl.innerHTML = '<div class="status-msg error">Escribe un número de celular válido.</div>';
    return;
  }
  const missing = CATEGORIES.filter(c=> !state.ratings[c.id]);
  if(missing.length){
    statusEl.innerHTML = `<div class="status-msg error">Falta calificar: ${missing.map(m=>m.label).join(', ')}.</div>`;
    return;
  }

  const submitBtn = document.getElementById('submitVote');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Enviando...';

  const weekKey = getWeekKey();
  const voteKey = `voto:${club.id}:${weekKey}:${phone}`;

  try{
    let already = null;
    try{
      already = await window.storage.get(voteKey, true);
    }catch(e){ already = null; }

    if(already){
      statusEl.innerHTML = '<div class="status-msg error">Este número ya calificó esta discoteca esta semana.</div>';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enviar calificación';
      return;
    }

    await window.storage.set(voteKey, JSON.stringify(state.ratings), true);

    const agg = await getAgg(club.id);
    CATEGORIES.forEach(c=>{ agg.sums[c.id] = (agg.sums[c.id]||0) + state.ratings[c.id]; });
    agg.count += 1;
    await window.storage.set('agg:'+club.id, JSON.stringify(agg), true);

    statusEl.innerHTML = '<div class="status-msg success">¡Gracias! Tu calificación quedó registrada para esta semana.</div>';
    submitBtn.textContent = 'Enviado ✓';
  }catch(e){
    statusEl.innerHTML = '<div class="status-msg error">No se pudo enviar. Intenta de nuevo.</div>';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Enviar calificación';
  }
}

function getWeekKey(){
  const d = new Date();
  const onejan = new Date(d.getFullYear(),0,1);
  const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay()+1)/7);
  return d.getFullYear()+'-w'+week;
}

async function render(){
  if(state.view === 'home') await renderHome();
  else await renderVote();
}

(async function init(){
  await ensureSeed();
  const clubParam = qs('d');
  if(clubParam){
    state.view = 'vote';
    state.clubId = clubParam;
  }
  render();
})();
</script>
</body>
</html>
